appId: com.gptn.desktop
productName: GPTN
copyright: © 2026 GPTN

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraMetadata:
  main: out/main/index.js

asar: true
npmRebuild: false

mac:
  category: public.app-category.productivity
  # Generated by `npm run icon` (hand-built ICNS container, no macOS tooling needed).
  icon: build/icon.icns
  darkModeSupport: true
  # Electron 44 embeds Chromium 152, which requires macOS 13 (Ventura) or later.
  # Declaring an older version here would let macOS install an app that cannot run.
  minimumSystemVersion: '13.0'
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Hardened runtime is required for notarisation; entitlements add network
  # access and the JIT permissions Electron needs.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing/notarisation are enabled by environment variables, never by values
  # committed to the repository (see scripts/notarize.cjs and the README).
  # Left false so an unsigned local build still succeeds; the notarize.cjs hook
  # notarises automatically when Apple credentials are present.
  notarize: false
  extendInfo:
    NSHumanReadableCopyright: '© 2026 GPTN'
    LSApplicationCategoryType: public.app-category.productivity
    NSSupportsAutomaticGraphicsSwitching: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: GPTN ${version}
  window:
    width: 560
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications

afterSign: scripts/notarize.cjs
