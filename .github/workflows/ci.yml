name: CI

# Fast feedback on every change: typecheck, tests and the production build run
# on Linux in a couple of minutes, so a broken branch is caught long before a
# release is tagged. The macOS packaging lives in build-macos.yml.
on:
  push:
    branches:
      - '**'
  pull_request:

# A push to a branch with an open pull request would otherwise run twice: both
# events resolve to the same branch name here, so the second run supersedes the
# first instead of queueing behind it.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, tests and production build
        run: npm run verify
