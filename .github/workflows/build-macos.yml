name: Build macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed to attach the DMG/ZIP to the GitHub Release of the tag.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: npm run typecheck && npm test

      - name: Build GPTN.app and DMG
        # With the signing secrets configured the app is signed and notarised;
        # without them the workflow still produces a runnable (unsigned) build.
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee dist.log
        env:
          # Optional: add these repository secrets to produce signed, notarised builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Report packaging failure
        # A failing packaging step is otherwise invisible when the raw job log
        # cannot be downloaded: the tail of the log becomes a job annotation.
        if: failure()
        run: |
          echo "Node $(node -v) / npm $(npm -v)"
          echo "--- release/ ---"
          ls -la release 2>/dev/null || echo "(no release directory)"
          if [ -f dist.log ]; then
            echo "--- tail of dist.log ---"
            tail -n 25 dist.log | while IFS= read -r line; do
              printf '%%s\n' "::error title=dist:mac::${line//'%'/'%25'}"
            done
          else
            echo "::error title=dist:mac::no dist.log produced"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPTN-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-log
          path: dist.log
          if-no-files-found: ignore

      - name: Attach installers to the GitHub Release
        # Only for tag builds, and only if the release does not exist yet: the
        # changelog written by hand is never overwritten.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "GPTN $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.zip --clobber
